name: Record Firefox MediaRecorder fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record with Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: List the types Firefox records
        run: node scripts/fixtures/record-mediarecorder.mjs --browsers firefox --list

      - name: Record
        shell: bash
        run: |
          mkdir -p firefox-recordings
          node scripts/fixtures/record-mediarecorder.mjs firefox-recordings --browsers firefox | tee firefox-recordings/provenance.jsonl

      - name: Upload the recordings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-recordings
          path: firefox-recordings
          if-no-files-found: error
