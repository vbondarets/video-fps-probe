name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check the source aliases against the package exports
        run: npm run check:aliases

      - name: Unit and fixture tests
        run: npm test

      - name: Self-test the ffprobe comparison
        run: node scripts/compare-ffprobe.ts --self-test

      - name: Compare engines against committed ffprobe references
        run: node scripts/compare-ffprobe.ts --engines own,mp4box,mediabunny --no-write

      - name: Self-test the size report
        run: node scripts/size-report.mjs --self-test

      - name: Build the demo
        run: npm run build:demo

      - name: Check bundle size budgets
        id: size
        run: node scripts/size-report.mjs demo/dist --check

      - name: Upload the measured size report
        if: failure() && steps.size.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-report
          path: report/size.*
          if-no-files-found: ignore

      - name: Check the generated doc tables against the reports
        run: node scripts/readme-tables.ts --check

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Self-test the package checks
        run: node scripts/check-dist.mjs --self-test

      - name: Build the library
        run: npm run build:lib

      - name: Check the package (publint and check-dist)
        run: npm run check:package

      - name: Check the package types (attw)
        run: npm run check:types

      - name: Check dist parity and the api.md types against the packed tarball
        run: npm run test:package

  e2e:
    name: End-to-end (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check every container image matches @playwright/test
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          images="$(sed -n 's|.*mcr\.microsoft\.com/playwright:v\([0-9][0-9.]*\)-.*|\1|p' .github/workflows/ci.yml | sort -u)"
          if [ "$images" != "$installed" ]; then
            echo "::error file=.github/workflows/ci.yml::the container images are Playwright $(echo $images) but @playwright/test is $installed; bump every image tag together with the package"
            exit 1
          fi

      - name: Run end-to-end tests
        run: npx playwright test

  consumers:
    name: Consumers (packed tarball in Vite 8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Place the consumers directory outside the workspace
        run: echo "CONSUMERS_DIR=$RUNNER_TEMP/consumers" >> "$GITHUB_ENV"

      - name: Pack the package and install the tarball, Vite and the peers
        run: npm run consumers:setup

      - name: Build the consumer fixtures
        run: npm run consumers:build

      - name: Check the package size matrix and the committed report
        id: matrix
        run: npm run size:matrix

      - name: Write the measured size matrix
        if: failure() && steps.matrix.outcome == 'failure'
        run: npm run size:matrix:write

      - name: Upload the measured size matrix
        if: failure() && steps.matrix.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-matrix
          path: report/size-matrix.*
          if-no-files-found: ignore

      - name: Check the generated doc tables against this measurement
        run: node scripts/readme-tables.ts --check

      - name: Run the consumer smoke tests (Chromium, Firefox, WebKit)
        run: npm run test:consumers
