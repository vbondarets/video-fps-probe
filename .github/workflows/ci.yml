name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check the source aliases against the package exports
        run: npm run check:aliases

      - name: Unit and fixture tests
        run: npm test

      - name: Self-test the ffprobe comparison
        run: node scripts/compare-ffprobe.ts --self-test

      - name: Compare engines against committed ffprobe references
        run: node scripts/compare-ffprobe.ts --engines own,mp4box,mediabunny --no-write

      - name: Self-test the size report
        run: node scripts/size-report.mjs --self-test

      - name: Build the demo
        run: npm run build:demo

      - name: Check bundle size budgets
        run: node scripts/size-report.mjs demo/dist --check

      - name: Check the README tables against the reports
        run: node scripts/readme-tables.ts --check

  e2e:
    name: End-to-end (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the container image matches @playwright/test
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          image="$(sed -n 's|.*mcr\.microsoft\.com/playwright:v\([0-9][0-9.]*\)-.*|\1|p' .github/workflows/ci.yml | head -n 1)"
          if [ "$installed" != "$image" ]; then
            echo "::error file=.github/workflows/ci.yml::the e2e container image is Playwright v$image but @playwright/test is $installed; bump the image tag together with the package"
            exit 1
          fi

      - name: Run end-to-end tests
        run: npx playwright test
